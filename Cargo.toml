[workspace]
resolver = "2"
members = ["mc-protocol", "mc-net", "mc-world", "mc-render", "mc-client"]

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.88"

[workspace.dependencies]
thiserror = "2"
flate2 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
rsa = "0.9"
aes = "0.8"
cfb8 = "0.8"
sha1 = "0.10"
rand = "0.8"
num-bigint = "0.4"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
hickory-resolver = "0.24"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
wgpu = "24"
winit = "0.30"
pollster = "0.4"
rayon = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rodio = { version = "0.20", default-features = false, features = ["vorbis"] }
image = { version = "0.25", default-features = false, features = ["png"] }
